const $=id=>document.getElementById(id),API='https://adydoupjiloapeuclsvr.supabase.co/rest/v1/settlement_entries',ROOM='7ueK0dml6S8r65SwOTumz7RkmrNIiGAh',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkeWRvdXBqaWxvYXBldWNsc3ZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDc3MDQsImV4cCI6MjEwMzQ4MzcwNH0.GLzsD0Gv-Y41P4o_dAuzLDfOQFKvFduH0EVOJdeixUY',HEADERS={apikey:ANON,Authorization:`Bearer ${ANON}`};let rows=[],payer='tatsu',loading=false;function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}function fmtInput(el){const raw=el.value.replace(/\D/g,'');el.value=raw?Number(raw).toLocaleString('ja-JP'):''}function numberFrom(el){return Number(el.value.replace(/,/g,'').replace(/\D/g,''))}$('amount').addEventListener('input',e=>fmtInput(e.target));function balance(){let b=0;for(const r of rows){const h=Number(r.amount)/2;b+=r.payer==='tatsu'?h:-h}return b}function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const b=balance();$('flow').textContent=Math.abs(b)<.5?'精算済み':b>0?'なみー → たつ':'たつ → なみー';$('balance').textContent=yen(Math.abs(b));$('history').innerHTML='';if(!rows.length){$('history').innerHTML='<div class="empty">まだ履歴なし。</div>';return}rows.forEach(r=>{const item=document.createElement('div');item.className='historyItem';const d=new Date(r.created_at),dateText=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,meta=dateText+'　'+(r.payer==='tatsu'?'たつが支払い':'なみーが支払い');item.innerHTML=`<div><div class="hTitle">${escapeHtml(r.title)}</div><div class="hMeta">${meta}</div></div><div class="hAmt">${yen(r.amount)}</div>`;$('history').appendChild(item)})}async function load(){if(loading)return;loading=true;try{const r=await fetch(`${API}?room_id=eq.${encodeURIComponent(ROOM)}&select=id,title,amount,payer,created_at&order=created_at.desc`,{headers:HEADERS,cache:'no-store'});if(!r.ok)throw Error(r.status);rows=await r.json();render()}catch(e){console.error(e)}finally{loading=false}}document.querySelectorAll('[data-payer]').forEach(btn=>btn.onclick=()=>{payer=btn.dataset.payer;document.querySelectorAll('[data-payer]').forEach(x=>x.classList.toggle('on',x===btn))});$('addPayment').onclick=async()=>{const a=numberFrom($('amount'));if(!a)return;const r=await fetch(API,{method:'POST',headers:{...HEADERS,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({room_id:ROOM,title:$('title').value.trim()||'支払い',amount:a,payer})});if(!r.ok){console.error(await r.text());return}$('title').value='';$('amount').value='';await load()};$('settleAll').onclick=()=>{const b=balance();if(Math.abs(b)<.5)return;$('settleText').textContent=`${$('flow').textContent} に ${yen(Math.abs(b))} を精算して、未精算の履歴を削除します。`;$('settleModal').classList.add('show')};$('cancelSettle').onclick=()=>$('settleModal').classList.remove('show');$('confirmSettle').onclick=async()=>{const r=await fetch(`${API}?room_id=eq.${encodeURIComponent(ROOM)}`,{method:'DELETE',headers:{...HEADERS,'Prefer':'return=minimal'}});if(!r.ok){console.error(await r.text());return}$('settleModal').classList.remove('show');await load()};$('settleModal').onclick=e=>{if(e.target===$('settleModal'))$('settleModal').classList.remove('show')};load();setInterval(load,2500);window.addEventListener('focus',load);
</script></body></html>
