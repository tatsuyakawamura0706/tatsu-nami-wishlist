<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>精算アプリ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Hiragino Sans",sans-serif;color:#111}*{box-sizing:border-box}body{margin:0;background:#fff}button,input{font:inherit}.app{max-width:560px;margin:auto;padding:28px 22px 58px}.top{text-align:center;margin-bottom:34px}.brand{font-size:17px;font-weight:600}.card{padding-bottom:30px;margin-bottom:30px;border-bottom:1px solid #ededf0}.sectionTitle{font-size:12px;font-weight:600;color:#6e6e73;margin-bottom:18px}label{display:block;font-size:11px;color:#8e8e93;margin:16px 0 6px}input{width:100%;border:0;border-bottom:1px solid #d9d9de;padding:11px 0;outline:0;font-size:14px}.money{font-size:22px;font-weight:700}.row{display:flex;background:#f2f2f7;border-radius:10px;padding:3px}.person{flex:1;border:0;background:transparent;border-radius:8px;padding:8px}.person.on{background:#fff;box-shadow:0 1px 4px #0001;font-weight:600}.add{width:100%;margin-top:20px;padding:11px;border:1px solid #007aff;border-radius:10px;background:transparent;color:#007aff;font-weight:600}.kicker,.flow{text-align:center}.kicker{font-size:11px;color:#8e8e93}.flow{font-size:14px;font-weight:600;margin-top:10px}.balance{text-align:center;font-size:38px;font-weight:650;margin:5px 0 10px}.settle{display:block;margin:auto;border:0;background:transparent;color:#007aff;padding:6px 12px;font-size:14px}.historyItem{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #f0f0f2}.hTitle{font-size:13px;font-weight:650}.hMeta{font-size:11px;color:#9a9aa0;margin-top:2px}.hAmt{font-size:14px;font-weight:600}.empty{font-size:12px;color:#aaa}.modalBackdrop{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:20px}.modalBackdrop.show{display:flex}.modal{width:min(320px,100%);background:#fffffff5;border-radius:18px;overflow:hidden;text-align:center}.modalBody{padding:20px 18px 16px}.modalTitle{font-size:16px;font-weight:650}.modalText{font-size:13px;color:#6e6e73;margin-top:7px}.modalActions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ddd}.modalActions button{border:0;background:transparent;padding:12px;font-size:14px}.modalActions button+button{border-left:1px solid #ddd}.cancelBtn{color:#007aff}.confirmBtn{color:#ff3b30;font-weight:600}</style></head><body><div class="app"><div class="top"><div class="brand">精算</div></div><section class="card"><div class="sectionTitle">支払いを追加</div><label>内容</label><input id="title" placeholder="例：夜ごはん"><label>金額</label><input id="amount" class="money" inputmode="numeric" placeholder="0"><label>払った人</label><div class="row"><button class="person on" data-payer="tatsu">たつ</button><button class="person" data-payer="nammy">なみー</button></div><button id="addPayment" class="add">追加</button></section><section class="card"><div class="kicker">現在の精算額</div><div id="flow" class="flow">精算済み</div><div id="balance" class="balance">¥0</div><button id="settleAll" class="settle">精算する</button></section><section class="card"><div class="sectionTitle">未精算の履歴</div><div id="history"></div></section></div><div id="settleModal" class="modalBackdrop"><div class="modal"><div class="modalBody"><div class="modalTitle">精算しますか？</div><div id="settleText" class="modalText"></div></div><div class="modalActions"><button id="cancelSettle" class="cancelBtn">キャンセル</button><button id="confirmSettle" class="confirmBtn">精算する</button></div></div></div><script>const $=id=>document.getElementById(id),API='https://adydoupjiloapeuclsvr.supabase.co/rest/v1/settlement_entries',ROOM='7ueK0dml6S8r65SwOTumz7RkmrNIiGAh',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoiYWR5ZG91cGppbG9hcGV1Y2xzdnIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NzkwNzcwNCwiZXhwIjoyMTAzNDgzNzA0fQ.GLzsD0Gv-Y41P4o_dAuzLDfOQFKvFduH0EVOJdeixUY',HEADERS={apikey:ANON,Authorization:`Bearer ${ANON}`};let rows=[],payer='tatsu',loading=false;const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');$('amount').oninput=e=>{const x=e.target.value.replace(/\D/g,'');e.target.value=x?Number(x).toLocaleString('ja-JP'):''};const num=()=>Number($('amount').value.replace(/\D/g,''));function bal(){return rows.reduce((b,r)=>b+(r.payer==='tatsu'?1:-1)*Number(r.amount)/2,0)}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const b=bal();$('flow').textContent=Math.abs(b)<.5?'精算済み':b>0?'なみー → たつ':'たつ → なみー';$('balance').textContent=yen(Math.abs(b));$('history').innerHTML=rows.length?'':'<div class="empty">まだ履歴なし。</div>';rows.forEach(r=>{const d=new Date(r.created_at),x=document.createElement('div');x.className='historyItem';x.innerHTML=`<div><div class="hTitle">${esc(r.title)}</div><div class="hMeta">${d.getMonth()+1}/${d.getDate()}　${r.payer==='tatsu'?'たつが支払い':'なみーが支払い'}</div></div><div class="hAmt">${yen(r.amount)}</div>`;$('history').appendChild(x)})}async function load(){if(loading)return;loading=true;try{const r=await fetch(`${API}?room_id=eq.${ROOM}&select=id,title,amount,payer,created_at&order=created_at.desc`,{headers:HEADERS,cache:'no-store'});if(r.ok){rows=await r.json();render()}}finally{loading=false}}document.querySelectorAll('[data-payer]').forEach(b=>b.onclick=()=>{payer=b.dataset.payer;document.querySelectorAll('[data-payer]').forEach(x=>x.classList.toggle('on',x===b))});$('addPayment').onclick=async()=>{const a=num();if(!a)return;const r=await fetch(API,{method:'POST',headers:{...HEADERS,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({room_id:ROOM,title:$('title').value.trim()||'支払い',amount:a,payer})});if(r.ok){$('title').value='';$('amount').value='';await load()}};$('settleAll').onclick=()=>{const b=bal();if(Math.abs(b)<.5)return;$('settleText').textContent=`${$('flow').textContent} に ${yen(Math.abs(b))} を精算して、未精算の履歴を削除します。`;$('settleModal').classList.add('show')};$('cancelSettle').onclick=()=>$('settleModal').classList.remove('show');$('confirmSettle').onclick=async()=>{const r=await fetch(`${API}?room_id=eq.${ROOM}`,{method:'DELETE',headers:{...HEADERS,'Prefer':'return=minimal'}});if(r.ok){$('settleModal').classList.remove('show');await load()}};load();setInterval(load,2500);</script></body></html>
