<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>やりたいことリスト</title><link rel="stylesheet" href="style1.css"><link rel="stylesheet" href="style2.css"><link rel="stylesheet" href="latest.css"></head><body><div class="container"><header><h1>♡ たつとなみーちゃんのWishlist</h1><p class="subtitle">やりたいことを、ちゃんとやろう。</p></header><div class="input-section"><div class="input-row"><div class="input-group"><label>やりたいこと</label><input type="text" id="itemInput" placeholder="例: 沖縄旅行に行く"></div><div class="input-group"><label>記入日</label><input type="date" id="dateInput"></div><div class="input-group"><label>記入者</label><div class="person-selector"><button class="person-btn" id="person1Btn" onclick="selectPerson(1)">たつ</button><button class="person-btn" id="person2Btn" onclick="selectPerson(2)">なみーちゃん</button></div></div><button class="add-btn" onclick="addItem()">追加</button></div></div><div class="main-view" id="mainView"><div class="tabs"><div class="tab active" data-tab="today" onclick="switchTab('today',this)">今日 <span class="tab-count" id="todayCount">0</span></div><div class="tab" data-tab="week" onclick="switchTab('week',this)">今週 <span class="tab-count" id="weekCount">0</span></div><div class="tab" data-tab="month" onclick="switchTab('month',this)">今月 <span class="tab-count" id="monthCount">0</span></div><div class="tab" data-tab="someday" onclick="switchTab('someday',this)">いつか <span class="tab-count" id="somedayCount">0</span></div></div><button class="memory-entry memory-entry-final" onclick="openMemories()"><div class="memory-info-final"><div class="memory-title">📖 たつとなみーちゃんの思い出</div><div class="memory-metrics-final"><div><span>これまでの思い出</span><strong><span id="doneCount">0</span> 個</strong></div><div><span>平均満足度</span><strong id="homeAvgRating">—</strong></div></div><div class="memory-link-final">思い出をみる <span>›</span></div></div></button><div class="category-filters" id="categoryFilters"><button class="filter-btn active" data-category="all" onclick="selectCategoryFilter('all')">すべて</button><button class="filter-btn" data-category="place" onclick="selectCategoryFilter('place')">📍 行きたい</button><button class="filter-btn" data-category="food" onclick="selectCategoryFilter('food')">🍴 食べたい</button><button class="filter-btn" data-category="activity" onclick="selectCategoryFilter('activity')">🎯 やりたい</button><button class="filter-btn" data-category="buy" onclick="selectCategoryFilter('buy')">🛍 買いたい</button></div><div class="items-container" id="itemsContainer"></div></div><div class="memories-view" id="memoriesView"><div class="memory-header"><button class="back-btn" onclick="closeMemories()">← 戻る</button><div><h2>たつとなみーちゃんの思い出</h2><p class="subtitle">やりたいことが、思い出になった記録</p></div></div><div id="memoriesContainer"></div></div></div><button class="fab-add" onclick="openAddModal()" aria-label="追加">＋</button><div class="modal-backdrop" id="addModal"><div class="add-modal"><h2>やりたいことを追加</h2><div class="input-group"><label>なにしたい？</label><input type="text" id="quickItemInput" placeholder="例：焼肉を食べに行く"></div><label style="display:block;margin-top:16px">いつ？</label><div class="quick-periods"><button class="period-btn active" data-period="today" onclick="selectPeriod('today')">今日</button><button class="period-btn" data-period="week" onclick="selectPeriod('week')">今週</button><button class="period-btn" data-period="month" onclick="selectPeriod('month')">今月</button><button class="period-btn" data-period="someday" onclick="selectPeriod('someday')">いつか</button></div><label>どんなこと？</label><div class="quick-categories"><button class="category-btn active" data-quick-category="place" onclick="selectQuickCategory('place')">📍 行きたい</button><button class="category-btn" data-quick-category="food" onclick="selectQuickCategory('food')">🍴 食べたい</button><button class="category-btn" data-quick-category="activity" onclick="selectQuickCategory('activity')">🎯 やりたい</button><button class="category-btn" data-quick-category="buy" onclick="selectQuickCategory('buy')">🛍 買いたい</button></div><label>だれ発案？</label><div class="person-selector" style="margin-top:8px"><button class="person-btn" id="quickPerson1" onclick="selectQuickPerson(1)">たつ</button><button class="person-btn" id="quickPerson2" onclick="selectQuickPerson(2)">なみーちゃん</button></div><div class="modal-actions"><button class="cancel-btn" onclick="closeAddModal()">キャンセル</button><button class="add-btn" onclick="addQuickItem()">追加</button></div></div></div><div class="modal-backdrop" id="ratingModal"><div class="add-modal" style="max-width:420px"><h2>どうだった？</h2><p class="subtitle" id="ratingItemTitle" style="margin-top:-10px"></p><div class="rating-stars"><button class="rating-star" data-rating="1" onclick="selectRating(1)">★</button><button class="rating-star" data-rating="2" onclick="selectRating(2)">★</button><button class="rating-star" data-rating="3" onclick="selectRating(3)">★</button><button class="rating-star" data-rating="4" onclick="selectRating(4)">★</button><button class="rating-star" data-rating="5" onclick="selectRating(5)">★</button></div><div class="rating-caption" id="ratingCaption">星をタップして満足度を記録</div><div class="modal-actions"><button class="cancel-btn" onclick="closeRatingModal()">キャンセル</button><button class="add-btn" id="saveRatingBtn" onclick="saveCompletionWithRating()" disabled>思い出に追加</button></div></div></div><button class="settings-btn" onclick="toggleSettings()">⚙️</button><div class="settings-panel" id="settingsPanel"><div class="settings-header"><h2>設定</h2><button class="close-settings" onclick="toggleSettings()">✕</button></div><div class="settings-section"><h3>名前設定</h3><div class="name-input-group"><div class="name-input-row"><div class="color-indicator" style="background:var(--accent-person1)"></div><input type="text" id="person1Name" onchange="updatePersonNames()"></div><div class="name-input-row"><div class="color-indicator" style="background:var(--accent-person2)"></div><input type="text" id="person2Name" onchange="updatePersonNames()"></div></div></div><div class="settings-section"><h3>テーマ</h3><div class="theme-grid"><div class="theme-option" data-theme="dark" onclick="changeTheme('dark')"><div class="theme-color-preview" style="background:linear-gradient(135deg,#00d4ff,#7b61ff)"></div><div class="theme-name">ダーク</div></div><div class="theme-option" data-theme="light" onclick="changeTheme('light')"><div class="theme-color-preview" style="background:linear-gradient(135deg,#0066cc,#6366f1)"></div><div class="theme-name">ライト</div></div><div class="theme-option" data-theme="sunset" onclick="changeTheme('sunset')"><div class="theme-color-preview" style="background:linear-gradient(135deg,#ff6b9d,#9d4edd)"></div><div class="theme-name">サンセット</div></div><div class="theme-option" data-theme="forest" onclick="changeTheme('forest')"><div class="theme-color-preview" style="background:linear-gradient(135deg,#4ade80,#22c55e)"></div><div class="theme-name">フォレスト</div></div></div></div></div><script type="module" src="app.js"></script><script src="latest.js"></script></body></html>
