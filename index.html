<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tatsu & Nami Wishlist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--blue:#0071e3;--blue2:#eaf4ff;--green:#34c759;--red:#ff3b30;--pink:#ff375f;--orange:#ff9f0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px 110px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}h1{font-size:30px;margin:0 0 6px;letter-spacing:-.04em}.sub{color:var(--sub);font-size:14px}.sync{font-size:12px;color:var(--sub);padding-top:8px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px;margin-bottom:14px}.tab{border:0;background:transparent;border-radius:13px;padding:11px 6px;font-weight:700;color:#444;cursor:pointer}.tab.active{background:var(--blue2);color:var(--blue)}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;color:#555}.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.035)}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:750;font-size:17px;line-height:1.4}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.badge{font-size:12px;border-radius:999px;padding:5px 9px;background:#f2f2f7;color:#666}.p1{background:#eaf4ff;color:#0566c2}.p2{background:#fff0f4;color:#c9003c}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.btn{border:0;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}.done{background:var(--blue);color:#fff}.move{background:#f2f2f7;color:#555}.del{background:#fff0f0;color:#c00}.memory{background:linear-gradient(150deg,#fff,#f7fbff);border:1px solid var(--line);border-radius:22px;padding:20px;position:sticky;top:18px}.memory h2{font-size:21px;margin:0 0 8px}.memory p{color:var(--sub);font-size:14px}.stat{font-size:34px;font-weight:800;margin:8px 0;color:var(--blue)}.empty{padding:45px 15px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:18px}.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 10px 28px rgba(0,113,227,.3)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.18)}.sheet h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;color:var(--sub);font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:#f5f5f7;padding:12px;font-size:16px}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opt{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;cursor:pointer}.opt.sel{background:var(--blue2);border-color:#bcdcff;color:var(--blue)}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cancel{background:#f2f2f7}.save{background:var(--blue);color:#fff}@media(max-width:780px){.wrap{padding:20px 14px 100px}.grid{grid-template-columns:1fr}.memory{position:static}.tabs{grid-template-columns:repeat(4,1fr)}h1{font-size:22px}.tab{font-size:13px;padding:10px 3px}.fab{right:18px;bottom:20px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>たつとなみーちゃんのやりたいこと</h1><div class="sub">ふたりで追加して、やったら思い出へ。</div></div><div class="sync" id="sync">同期中…</div></header>
<div class="tabs" id="tabs"></div>
<div class="filters" id="filters"></div>
<div class="grid"><main class="list" id="list"></main><aside class="memory"><h2>ふたりの思い出</h2><div class="stat" id="doneCount">0</div><p>「やった！」にした数。データはSupabaseで共有されるよ。</p></aside></div>
</div>
<button class="fab" id="open">＋</button>
<div class="modal" id="modal"><div class="sheet"><h2>やりたいことを追加</h2><div class="field"><label>タイトル</label><input id="title" placeholder="例：箱根で温泉" /></div><div class="field"><label>いつ</label><div class="choice" id="periods"></div></div><div class="field"><label>カテゴリ</label><div class="choice" id="cats"></div></div><div class="field"><label>誰の案？</label><div class="choice" id="persons"></div></div><div class="modalActions"><button class="btn cancel" id="cancel">閉じる</button><button class="btn save" id="save">追加</button></div></div></div>
<script>
const {createClient}=supabase;
const db=createClient('https://adydoupjiloapeuclsvr.supabase.co','sb_publishable_13AfLUbqgYm9bkju8x84RA_eJtiLe1g');
const PERIODS={today:'今日',week:'今週',month:'今月',someday:'いつか'};
const CATS={all:'すべて',place:'📍 行きたい',food:'🍴 食べたい',activity:'🎯 やりたい',buy:'🛍 買いたい'};
const ICON={place:'📍',food:'🍴',activity:'🎯',buy:'🛍'};
let items=[],tab='someday',filter='all',draft={period:'someday',category:'place',person:1};
const el=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function load(){el('sync').textContent='同期中…';const {data,error}=await db.from('wishlist_items').select('*').order('created_at',{ascending:false});if(error){el('sync').textContent='同期エラー';console.error(error);return}items=data||[];el('sync').textContent='共有中';render()}
function render(){renderTabs();renderFilters();const done=items.filter(x=>x.completed);el('doneCount').textContent=done.length;let list=items.filter(x=>!x.completed&&x.period===tab);if(filter!=='all')list=list.filter(x=>x.category===filter);el('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">ここはまだ空っぽ。＋から追加しよう。</div>'}
function renderTabs(){el('tabs').innerHTML=Object.entries(PERIODS).map(([k,v])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${v} ${items.filter(x=>!x.completed&&x.period===k).length}</button>`).join('')}
function renderFilters(){el('filters').innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip ${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}
function card(x){return `<div class="card"><div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta"><span class="badge">${ICON[x.category]||'🎯'} ${CATS[x.category]?.replace(/^.. /,'')||'やりたい'}</span><span class="badge ${x.person===1?'p1':'p2'}">${x.person===1?'たつ':'なみーちゃん'}</span></div></div></div><div class="actions"><button class="btn done" data-done="${x.id}">✓ やった！</button>${Object.entries(PERIODS).filter(([k])=>k!==x.period).map(([k,v])=>`<button class="btn move" data-move="${x.id}" data-period="${k}">→ ${v}</button>`).join('')}<button class="btn del" data-del="${x.id}">削除</button></div></div>`}
async function add(){const title=el('title').value.trim();if(!title)return;el('save').disabled=true;const {error}=await db.from('wishlist_items').insert({title,category:draft.category,period:draft.period,person:draft.person,completed:false});el('save').disabled=false;if(error){alert('追加できなかった');console.error(error);return}el('title').value='';closeModal();await load()}
async function update(id,values){const {error}=await db.from('wishlist_items').update({...values,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('更新できなかった');console.error(error);return}await load()}
async function remove(id){if(!confirm('削除する？'))return;const {error}=await db.from('wishlist_items').delete().eq('id',id);if(error){alert('削除できなかった');console.error(error);return}await load()}
function choices(){el('periods').innerHTML=Object.entries(PERIODS).map(([k,v])=>`<button class="opt ${draft.period===k?'sel':''}" data-period-opt="${k}">${v}</button>`).join('');el('cats').innerHTML=Object.entries(CATS).filter(([k])=>k!=='all').map(([k,v])=>`<button class="opt ${draft.category===k?'sel':''}" data-cat-opt="${k}">${v}</button>`).join('');el('persons').innerHTML=`<button class="opt ${draft.person===1?'sel':''}" data-person-opt="1">たつ</button><button class="opt ${draft.person===2?'sel':''}" data-person-opt="2">なみーちゃん</button>`}
function openModal(){choices();el('modal').classList.add('on');setTimeout(()=>el('title').focus(),50)}function closeModal(){el('modal').classList.remove('on')}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-filter],[data-done],[data-move],[data-del],[data-period-opt],[data-cat-opt],[data-person-opt]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render()}else if(t.dataset.filter){filter=t.dataset.filter;render()}else if(t.dataset.done){await update(t.dataset.done,{completed:true,completed_at:new Date().toISOString()})}else if(t.dataset.move){await update(t.dataset.move,{period:t.dataset.period})}else if(t.dataset.del){await remove(t.dataset.del)}else if(t.dataset.periodOpt){draft.period=t.dataset.periodOpt;choices()}else if(t.dataset.catOpt){draft.category=t.dataset.catOpt;choices()}else if(t.dataset.personOpt){draft.person=Number(t.dataset.personOpt);choices()}});
el('open').onclick=openModal;el('cancel').onclick=closeModal;el('save').onclick=add;el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});el('title').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
load();setInterval(load,15000);
</script>
</body>
</html>
